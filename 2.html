<!-- MUSIC PLAYER — BOTTOM LEFT -->
<div class="music-player">
  <button class="music-btn" id="musicToggle">🎵</button>
  <audio id="bgSong" loop preload="auto">
    <source src="music1.mp3" type="audio/mpeg">
  
</div>

<!-- JAVASCRIPT — ADD THIS PART -->
<script>
const song = document.getElementById('bgSong');
const btn = document.getElementById('musicToggle');
let isPlaying = false;

btn.addEventListener('click', () => {
  if (!isPlaying) {
    song.play()
      .then(() => {
        btn.textContent = '🔊';
        btn.classList.add('playing');
        isPlaying = true;
      })
      .catch(err => {
        alert('Check if music1.mp3 is in the same folder!');
      });
  } else {
    song.pause();
    btn.textContent = '🎵';
    btn.classList.remove('playing');
    isPlaying = false;
  }
});
</script>
